# ============================================
# CyberBank: Operation BlackVault
# Docker Compose - Service Orchestration
# ============================================

services:
  # ---- MySQL Database Service (Standalone Deployment) ----
  db:
    image: mysql:8.0
    container_name: cyberbank-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cyberbank
      MYSQL_USER: cyberbank_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyberbank_secure_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cyberbank-net
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_secure_password} || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ---- Flask CTF Platform ----
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: cyberbank-platform
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-cyberbank_secret_key_2026}
      MYSQL_DATABASE: cyberbank
      MYSQL_USER: ${MYSQL_USER:-cyberbank_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyberbank_secure_password}
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    ports:
      - "5000:5000"
    volumes:
      - ./platform:/app:ro
    networks:
      - cyberbank-net
    depends_on:
      db:
        condition: service_healthy

  # ---- Stage 3: Broken Banking Portal (Vulnerable Container) ----
  stage3-web:
    build:
      context: ./challenges/stage3_web
      dockerfile: Dockerfile
    container_name: cyberbank-stage3-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - cyberbank-net

  # ---- Stage 6: BlackVault Server (Vulnerable Linux Container) ----
  blackvault:
    build:
      context: ./challenges/stage6_linux
      dockerfile: Dockerfile
    container_name: cyberbank-blackvault
    restart: unless-stopped
    ports:
      - "2222:22"
    networks:
      - cyberbank-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 100

networks:
  cyberbank-net:
    driver: bridge
    name: cyberbank-network

volumes:
  mysql-data:
    name: cyberbank-mysql-data
