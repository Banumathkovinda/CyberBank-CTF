{% extends "base.html" %}

{% block title %}Operative Login | CyberBank: Operation BlackVault{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">BlackVault Terminal</h1>
      <p class="auth-subtitle">Authenticate to access challenges and track your telemetry</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
      <div class="form-group">
        <label for="identifier" class="form-label">Username or Email</label>
        <input 
          type="text" 
          id="identifier" 
          name="identifier" 
          class="form-input" 
          placeholder="username or email" 
          value="{{ identifier or '' }}"
          required 
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Passphrase</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Enter your passphrase" 
          required 
          autocomplete="current-password"
        >
      </div>

      <label class="form-check">
        <input type="checkbox" name="remember" value="1">
        <span>Maintain session on this terminal</span>
      </label>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        <span>Authenticate</span>
      </button>
    </form>

    <div class="auth-footer">
      New operative without clearance? 
      <a href="{{ url_for('auth.register') }}" class="auth-link">Request Access</a>
    </div>
  </div>
</div>
{% endblock %}
