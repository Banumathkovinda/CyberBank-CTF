<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="metal-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94A3B8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="18" y="16" width="66" height="70" rx="14" ry="14" 
        fill="#111620" fill-opacity="0.95" 
        stroke="#94A3B8" stroke-width="3" 
        filter="url(#glow-2)" />

  <!-- Blue Ribbon -->
  <!-- Left Wing -->
  <polygon points="36,16 25,6 42,12" fill="url(#ribbon-grad)" />
  <polygon points="25,6 33,12 28,15" fill="#1D4ED8" />
  <!-- Right Wing -->
  <polygon points="64,16 75,6 58,12" fill="url(#ribbon-grad)" />
  <polygon points="75,6 67,12 72,15" fill="#1D4ED8" />

  <!-- Medal Medallion -->
  <circle cx="50" cy="18" r="13" fill="url(#metal-grad-2)" stroke="#94A3B8" stroke-width="1.5" />
  <circle cx="50" cy="18" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <text x="50" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#334155">2</text>

  <!-- Big Bold Overlapping Rank Number at Bottom-Left -->
  <text x="12" y="93" 
        font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#E2E8F0" 
        stroke="#111620" 
        stroke-width="4.5" 
        stroke-linejoin="round"
        paint-order="stroke fill">2</text>
</svg>